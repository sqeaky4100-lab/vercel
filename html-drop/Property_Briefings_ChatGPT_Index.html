<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tempe Property Search / ChatGPT Briefings</title><style>/* ============================================================================
   OpenAI CutGlass Artifact Design System — COLORS_AND_TYPE.css
   Self-contained, zero-dependency token set for the chatgpt-artifact-export
   theme. Mirrors the OpenAI / ChatGPT document look: neutral #f9f9f9 page,
   OpenAI Sans system stack, grey code chips, dark ChatGPT-style code blocks,
   borderless docs tables, near-black accents. LIGHT and DARK themes defined.
   No webfonts, no CDNs. (The -font skill edition embeds OpenAI Sans WOFF2 as
   data: URLs at conversion time; this file is unchanged there.)

   Sources of truth:
   - Tokens: HANDOFF — OpenAI CutGlass Artifact Skill (locked) + this project's
     OPENAI_ARTIFACT_TOKENS.css (Figma OpenAI Colors 2112-12011, chatgpt.com
     light/dark captures, platform.openai.com docs capture).
   - Content styling (tables, code, chips, prose rhythm): the session token
     layer — NOT the harness placeholder document.
   ============================================================================ */

/* ----------------------------------------------------------------------------
   1. BASE COLOR TOKENS — LIGHT (default)
   ---------------------------------------------------------------------------- */
:root,
[data-theme="light"] {
  --page-surface:    #f9f9f9;  /* page behind the glass sheet                */
  --surface-primary: #ffffff;  /* cards, buttons, sheets                     */
  --surface-hover:   rgba(13, 13, 13, .055);
  --surface-press:   rgba(13, 13, 13, .10);
  --text-primary:    #282828;
  --text-secondary:  #5d5d5d;
  --text-tertiary:   #8f8f8f;
  --border-default:  rgba(13, 13, 13, .12);
  --border-strong:   rgba(13, 13, 13, .20);
  --link-default:    #0066cc;
  --link-hover:      #0052a3;
  --link-visited:    #6a23bb;
  --success:         #2e7d32;
  --warning:         #f57c00;
  --error:           #c62828;
  --callout-note-bg:    #f0f7ff;
  --callout-warning-bg: #fff8f0;
  --callout-error-bg:   #fff0f0;
  --callout-success-bg: #f0fff4;
  --background-code:       #f1f1ef;  /* inline code chip fill                */
  --background-table-head: #fafafa;
  --glass-fill:      rgba(255, 255, 255, .40);
  --hole-outline:    rgba(13, 13, 13, .11);
  --hole-highlight:  rgba(255, 255, 255, .72);
  --scrollbar-thumb:       rgba(13, 13, 13, .28);
  --scrollbar-thumb-hover: rgba(13, 13, 13, .42);
  --toc-track:     #ededed;
  --toc-indicator: #181818;
  --toc-inactive:  #8f8f8f;
  --toc-active:    #282828;
  --crumb-link:    #6e6e6e;
  --crumb-sep:     #b4b4b4;
  --crumb-current: #0d0d0d;
  --scrim:         rgba(24, 24, 24, .18);
  --progress-fill: rgba(48, 48, 48, .72);

  /* ChatGPT-style dark code blocks (both themes render pre on near-black) */
  --pre-bg:     #0f0f0f;
  --pre-text:   #e8e8e8;
  --pre-border: rgba(255, 255, 255, .06);

  /* Conversation chrome */
  --bubble:        #f4f4f4;  /* user prompt bubble (chatgpt composer grey)   */
  --bubble-border: #ececec;
  --warn-bg:       #fff8f0;
  --warn-text:     #8a5a00;
  --thinking:      #8f8f8f;

  color-scheme: light;
}

/* ----------------------------------------------------------------------------
   2. BASE COLOR TOKENS — DARK (neutral near-black, chatgpt.com dark viewer)
   ---------------------------------------------------------------------------- */
[data-theme="dark"] {
  --page-surface:    #171717;
  --surface-primary: #303030;
  --surface-hover:   rgba(255, 255, 255, .08);
  --surface-press:   rgba(255, 255, 255, .14);
  --text-primary:    #ececec;
  --text-secondary:  #b4b4b4;
  --text-tertiary:   #8f8f8f;
  --border-default:  rgba(255, 255, 255, .16);
  --border-strong:   rgba(255, 255, 255, .26);
  --link-default:    #7ab8ff;
  --link-hover:      #a8d1ff;
  --link-visited:    #c4a2ff;
  --success:         #6ec177;
  --warning:         #f0a04b;
  --error:           #f0736a;
  --callout-note-bg:    #14202c;
  --callout-warning-bg: #2a2114;
  --callout-error-bg:   #2c1717;
  --callout-success-bg: #142a1b;
  --background-code:       #292927;
  --background-table-head: #262626;
  --glass-fill:      rgba(0, 0, 0, .36);
  --hole-outline:    rgba(255, 255, 255, .15);
  --hole-highlight:  rgba(255, 255, 255, .055);
  --scrollbar-thumb:       rgba(255, 255, 255, .26);
  --scrollbar-thumb-hover: rgba(255, 255, 255, .40);
  --toc-track:     #3a3a3a;
  --toc-indicator: #ececec;
  --toc-inactive:  #8f8f8f;
  --toc-active:    #ececec;
  --crumb-link:    #b4b4b4;
  --crumb-sep:     #6e6e6e;
  --crumb-current: #ffffff;
  --scrim:         rgba(0, 0, 0, .46);
  --progress-fill: rgba(205, 205, 205, .66);

  --pre-bg:     #0a0a0a;
  --pre-text:   #e8e8e8;
  --pre-border: rgba(255, 255, 255, .08);

  --bubble:        #303030;
  --bubble-border: #3a3a3a;
  --warn-bg:       #2a2114;
  --warn-text:     #f0c88a;
  --thinking:      #8f8f8f;

  color-scheme: dark;
}

/* ----------------------------------------------------------------------------
   2A. COMPATIBILITY ALIASES
   The converter pipeline, index builder, and exported artifact body markup
   reference shared legacy token names. Everything maps onto the OpenAI
   tokens above so the whole pipeline is retokened in one place.
   ---------------------------------------------------------------------------- */
:root {
  --bg:            var(--page-surface);
  --bg-sunk:       var(--background-code);
  --text:          var(--text-primary);
  --muted:         var(--text-secondary);
  --faint:         var(--text-tertiary);
  --rule:          var(--border-default);
  --rule-dark:     var(--border-strong);
  --code-bg:       var(--background-code);
  --code:          var(--text-primary);   /* OpenAI inline code is neutral ink, not red-brown */
  --code-border:   var(--border-default);
  --slash:         var(--link-default);
  --ui:            var(--text-primary);
  --ui-muted:      var(--text-tertiary);

  /* Index sidebar shell */
  --side-bg:       var(--page-surface);
  --side-bg-2:     var(--surface-hover);
  --side-active:   var(--surface-press);
  --side-text:     var(--text-secondary);
  --side-faint:    var(--text-tertiary);
  --side-border:   var(--border-default);

  /* Accent: OpenAI near-black (light) / near-white (dark) — never clay */
  --accent:        var(--toc-indicator);
  --accent-ink:    var(--text-primary);
  --accent-soft:   var(--surface-press);
  --on-accent:     var(--page-surface);

  /* Legacy geometry names consumed by the index TOC component */
  --crumb-h: 32px;
  --artifact-gutter: 8px;
  --artifact-inset: 8px;

  /* Exporter DOM aliases */
  --bg-000: var(--bg);
  --bg-100: var(--bg-sunk);
  --bg-200: var(--side-bg-2);
  --text-000: var(--ui);
  --text-100: var(--text);
  --text-200: var(--muted);
  --text-300: var(--side-faint);
  --text-400: color-mix(in srgb, var(--side-faint) 72%, transparent);
  --border-200: var(--rule);
  --border-300: var(--side-border);
  --border-400: var(--rule-dark);
}

.bg-bg-000 { background-color: var(--bg-000); }
.bg-bg-100 { background-color: var(--bg-100); }
.bg-bg-200 { background-color: var(--bg-200); }
.text-text-000 { color: var(--text-000); }
.text-text-100 { color: var(--text-100); }
.text-text-200 { color: var(--text-200); }
.text-text-300 { color: var(--text-300); }
.text-text-400 { color: var(--text-400); }
.border-border-200 { border-color: var(--border-200); }
.border-border-300 { border-color: var(--border-300); }
.border-border-400 { border-color: var(--border-400); }
.border-border-300\/60 { border-color: var(--border-300); border-color: color-mix(in srgb, var(--border-300) 60%, transparent); }
.border-border-300\/30 { border-color: var(--border-300); border-color: color-mix(in srgb, var(--border-300) 30%, transparent); }
.border-t-0\.5 { border-top-width: .5px; }

/* Minimal layout aliases found in exported artifact body markup. */
.grid { display: grid; }
.grid-cols-1 { grid-template-columns: minmax(0, 1fr); }
.gap-3\.5 { gap: .875rem; }
.min-w-0 { min-width: 0; }
.overflow-x-auto { overflow-x: auto; }
.w-full { width: 100%; }
.px-2 { padding-left: .5rem; padding-right: .5rem; }
.mb-6 { margin-bottom: 1.5rem; }
.mt-3 { margin-top: .75rem; }
.mt-2 { margin-top: .5rem; }
.-mb-1 { margin-bottom: -.25rem; }
.my-3 { margin-top: .75rem; margin-bottom: .75rem; }
.mx-1\.5 { margin-left: .375rem; margin-right: .375rem; }

/* ----------------------------------------------------------------------------
   3. TYPOGRAPHY — OpenAI Sans first, portable system fallbacks.
   The base skill embeds nothing; the -font edition injects @font-face for
   "OpenAI Sans" at conversion time and this stack picks it up automatically.
   The --serif alias deliberately maps to the sans stack: the entire OpenAI
   document voice is sans-serif, and the shared pipeline styles body copy
   through --serif.
   ---------------------------------------------------------------------------- */
:root {
  --font-sans: "OpenAI Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif: var(--font-sans);
  --sans:  var(--font-sans);
  --mono:  var(--font-mono);

  /* Type scale (px) — locked CutGlass scale */
  --fs-h1:   40px;  --lh-h1: 48px;
  --fs-h2:   24px;  --lh-h2: 32px;
  --fs-h3:   20px;  --lh-h3: 28px;
  --fs-body: 16px;
  --fs-ui:   14px;   /* tables, bubbles, thinking                      */
  --fs-meta: 13px;   /* breadcrumb                                     */

  /* Rhythm */
  --lh-body: 1.5;    /* 16px body on a 24px line                       */
  --lh-tight: 1.2;
  --ls-body: 0;
  --stack-gap: 14px; /* row gap between immediate Markdown blocks      */

  /* Radii */
  --r-chip: 5px;
  --r-pre:  8px;
  --r-bubble: 14px;
  --r-card: 10px;

  /* Layout */
  --measure: 768px;      /* centered content column                    */
  --pad-x: 44px;         /* column side padding (18px on mobile)       */
  --side-w: 264px;       /* index sidebar width                        */
}

/* ----------------------------------------------------------------------------
   4. SEMANTIC ELEMENT STYLES
   Scoped to the classes the converter emits (.standard-markdown grid,
   .table-shell/.table-wrap, .quote, .user-bubble, …).
   ---------------------------------------------------------------------------- */
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

/* Exporter DOM-compatible font aliases → OpenAI Sans. */
.font-openai-response,
.font-openai-response-body {
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
}

.standard-markdown { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--stack-gap); }
.standard-markdown > * { min-width: 0; }

h1, h2, h3 { color: var(--text); font-weight: 600; }
h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); letter-spacing: -.03em; margin: 12px 0 -2px; }
h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); letter-spacing: -.01em; margin: 14px 0 -4px; }
h3 { font-size: var(--fs-h3); line-height: var(--lh-h3); letter-spacing: -.01em; margin: 8px 0 -4px; }

p  { margin: 0; line-height: var(--lh-body); overflow-wrap: break-word; }
strong { font-weight: 600; }
em { font-style: italic; }
a { color: var(--link-default); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }
a:visited { color: var(--link-visited); }
mark { padding: 0 3px; border-radius: 3px; background: var(--callout-warning-bg); color: var(--text); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 10px 0; }

code, .chip {
  font-family: var(--font-mono);
  font-size: 0.875em;             /* 14px on 16px body */
  color: var(--code);
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: var(--r-chip);
  padding: 0.10em 0.38em;
  overflow-wrap: anywhere;
}

/* Fenced code: ChatGPT-style near-black block in BOTH themes. */
.code-block, pre.code-block {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.55;
  color: var(--pre-text);
  background: var(--pre-bg);
  border: 1px solid var(--pre-border);
  border-radius: var(--r-pre);
  padding: 14px 16px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

ul, ol { display: flex; flex-direction: column; gap: 4px; margin: 0 0 12px; padding-left: 30px; }
li { padding-left: 4px; line-height: var(--lh-body); overflow-wrap: break-word; }

.quote {
  border-left: 3px solid var(--border-strong);
  padding-left: 16px;
  color: var(--muted);
}

/* Block-level blockquotes (multi-paragraph, nested tables/lists) render as a
   normal-weight quoted block with the 3px left rule (v5.3 semantics). */
blockquote.quote {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--stack-gap);
  margin: 0;
  padding-left: 16px;
  color: var(--text);
  font-style: normal;
}
blockquote.quote > * { min-width: 0; }
blockquote.quote p {
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text);
  font-style: normal;
}
blockquote.quote .table-shell { margin: 0 0 4px; }
blockquote.quote .table-wrap { padding-left: 0; }
blockquote.quote ul,
blockquote.quote ol { margin: 0; }
blockquote.quote > *:last-child { margin-bottom: 0; }
.note { color: var(--muted); }

/* ----------------------------------------------------------------------------
   Tables — OpenAI docs style (locked): BORDERLESS. No outer or side borders;
   a strong hairline under the filled header row, a ghost hairline under each
   body row (none under the last), and a subtle zebra. Horizontally scrollable
   inside .table-wrap when needed.
   ---------------------------------------------------------------------------- */
.table-shell {
  position: relative;
  width: 100%;
  margin: 0 0 20px;
}
.table-wrap {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  padding: 0 2px;
}
.table-wrap::-webkit-scrollbar { height: 4px; }
.table-wrap::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--rule-dark) 55%, transparent); border-radius: 999px; }
table { min-width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
th, td {
  padding: 8px 12px;
  text-align: left;
  vertical-align: top;
  border: 0;
}
th {
  background: var(--background-table-head);
  font-weight: 600;
  font-size: 13px;
  border-bottom: 1px solid var(--border-strong);
}
td { border-bottom: 1px solid color-mix(in srgb, var(--border-default) 55%, transparent); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface-primary) 32%, transparent); }
.right { text-align: right; }
.center { text-align: center; }

@media (max-width: 652.98px) {
  :root {
    --fs-h1: 28px;  --lh-h1: 36px;
    --fs-h2: 20px;  --lh-h2: 28px;
    --fs-h3: 16px;  --lh-h3: 24px;
    --fs-body: 16px;
    --fs-ui: 14px;
    --lh-body: 1.5;
    --stack-gap: 13px;
    --pad-x: 18px;
    /* Narrow left guard, wider right guard — mobile scroll edge cues,
       painted with the OpenAI page surface. */
    --table-edge-solid-left: 2px;
    --table-edge-solid-right: 12px;
    --table-edge-fade-left: 12px;
    --table-edge-fade-right: 18px;
    --table-edge-total-left: calc(var(--table-edge-solid-left) + var(--table-edge-fade-left));
    --table-edge-total-right: calc(var(--table-edge-solid-right) + var(--table-edge-fade-right));
  }
  body { font-size: var(--fs-body); line-height: var(--lh-body); }
  .font-openai-response,
  .font-openai-response-body { font-size: var(--fs-body); line-height: var(--lh-body); }
  h1 { margin: 10px 0 -2px; }
  h2 { margin: 12px 0 -4px; scroll-margin-top: 56px; }
  h3 { margin: 8px 0 -4px; scroll-margin-top: 56px; }
  ul, ol { padding-left: 26px; }

  /* Mobile tables scroll horizontally with edge fade cues in --page-surface. */
  .table-shell {
    position: relative;
    width: 100%;
    margin-right: 0;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .table-wrap {
    width: 100%;
    padding: 0 2px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .table-wrap::-webkit-scrollbar { display: none; }
  /* Mobile tables per the locked spec: 16px/24px, horizontal scroll. */
  table {
    width: max-content;
    min-width: 100%;
    max-width: none;
    font-size: 16px;
    line-height: 24px;
  }
  th, td {
    white-space: nowrap;
    padding: 8px 12px;
  }
  th { font-size: 13px; }
  td:last-child, th:last-child { padding-right: calc(8px + var(--table-edge-solid-right)); }

  .table-shell::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 0;
    z-index: 4;
    width: var(--table-edge-total-left);
    pointer-events: none;
    opacity: 0;
    transition: opacity .16s ease;
    background: linear-gradient(
      to right,
      var(--bg) 0,
      var(--bg) var(--table-edge-solid-left),
      color-mix(in srgb, var(--bg) 82%, transparent) calc(var(--table-edge-solid-left) + 4px),
      color-mix(in srgb, var(--bg) 40%, transparent) calc(var(--table-edge-solid-left) + 9px),
      transparent 100%
    );
  }
  .table-shell::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: 0;
    z-index: 4;
    width: var(--table-edge-total-right);
    pointer-events: none;
    opacity: 0;
    transition: opacity .16s ease;
    background: linear-gradient(
      to left,
      var(--bg) 0,
      var(--bg) var(--table-edge-solid-right),
      color-mix(in srgb, var(--bg) 90%, transparent) calc(var(--table-edge-solid-right) + 7px),
      color-mix(in srgb, var(--bg) 50%, transparent) calc(var(--table-edge-solid-right) + 15px),
      transparent 100%
    );
  }
  .table-shell.has-left::before { opacity: 1; }
  .table-shell.has-right::after { opacity: 1; }
}

/* ----------------------------------------------------------------------------
   Breadcrumb (rendered inside the 40px CutGlass band on desktop; static in
   flow on mobile). No chevron — OpenAI crumbs are plain / separators.
   ---------------------------------------------------------------------------- */
.project-crumb {
  font-family: var(--font-sans);
  font-size: var(--fs-meta);
  line-height: 16px;
  color: var(--crumb-link);
  display: flex;
  align-items: center;
  min-width: 0;
}
.project-crumb .sep { color: var(--crumb-sep); padding: 0 8px; flex: none; }
.project-crumb .crumb-current {
  color: var(--crumb-current);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ----------------------------------------------------------------------------
   Conversation chrome — v5 logic, OpenAI skin (chatgpt composer bubble).
   ---------------------------------------------------------------------------- */
.user-bubble {
  font-family: var(--font-sans);
  background: var(--bubble);
  border: 1px solid var(--bubble-border);
  border-radius: var(--r-bubble);
  font-size: 14px;
  line-height: 1.55;
}
.thinking { font-family: var(--font-sans); color: var(--thinking); font-size: 14px; }
.warning {
  font-family: var(--font-sans);
  background: var(--warn-bg);
  color: var(--warn-text);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 14px;
}
.slash-command { font-family: var(--font-sans); color: var(--slash); font-weight: 500; }

/* ----------------------------------------------------------------------------
   Callouts (available to hand-authored HTML; the md renderer does not emit
   them, but skill users may write them inline).
   ---------------------------------------------------------------------------- */
.callout {
  border-radius: 8px; padding: 12px 14px;
  border-left: 4px solid var(--border-strong); background: var(--surface-hover);
  font-size: 14px; line-height: 20px;
}
.callout-title { font-weight: 600; margin-bottom: 4px; font-size: 13px; }
.callout-note    { border-left-color: var(--link-default); background: var(--callout-note-bg); }
.callout-warning { border-left-color: var(--warning);      background: var(--callout-warning-bg); }
.callout-error   { border-left-color: var(--error);        background: var(--callout-error-bg); }
.callout-success { border-left-color: var(--success);      background: var(--callout-success-bg); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; }

.app { display: flex; height: 100vh; overflow: hidden; background: var(--bg); }

/* Sidebar */
.sidebar {
  width: 264px; flex: 0 0 264px; background: var(--side-bg);
  border-right: 1px solid var(--side-border);
  display: flex; flex-direction: column; font-family: var(--sans);
  transition: margin-left .18s ease;
}
.app.collapsed .sidebar { margin-left: -264px; }
.side-head { display: flex; align-items: center; gap: 10px; padding: 16px 14px 12px; }
.side-logo { width: 26px; height: 26px; flex: 0 0 26px; }
.side-title { font-size: 14px; font-weight: 700; color: var(--side-text); }
.side-sub { font-size: 11px; color: var(--side-faint); margin-top: 1px; }
.side-search {
  margin: 2px 12px 8px; display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--side-border); border-radius: 8px;
  padding: 7px 10px; color: var(--side-faint); font-size: 13px;

.side-search input { border: 0; background: transparent; outline: none; font-family: var(--sans); font-size: 13px; color: var(--side-text); width: 100%; }

.side-item .ic { width: 16px; height: 16px; flex: 0 0 16px; color: var(--side-faint); }
.side-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-item:hover { background: var(--side-bg-2); }
.side-item.active { background: var(--side-active); color: var(--accent-ink); font-weight: 600; }
.side-item.active .ic { color: var(--accent-ink); }
.side-divider { height: 1px; background: var(--side-border); margin: 4px 12px; }
.side-foot { border-top: 1px solid var(--side-border); padding: 10px 12px; display: flex; align-items: center; gap: 8px; }

/* Sidebar-footer theme toggle (the index's own toggle) */
.theme-toggle { display: inline-flex; align-items: center; gap: 7.7px; border: 1px solid var(--side-border); border-radius: 999px; padding: 5.5px 8.8px; background: var(--bg); color: var(--ui); font-family: var(--sans); font-size: 13.2px; line-height: 1; cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
.theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tt-icon { width: 15.4px; text-align: center; user-select: none; }
.tt-track { width: 37.4px; height: 22px; position: relative; display: inline-block; background: var(--rule); border-radius: 999px; transition: background-color .15s ease; }
.tt-thumb { position: absolute; width: 17.6px; height: 17.6px; left: 2.2px; top: 2.2px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.22); transition: transform .15s ease, background-color .15s ease; }
html[data-theme="dark"] .tt-track { background: var(--accent); }
html[data-theme="dark"] .tt-thumb { transform: translateX(15.4px); background: var(--text); }

/* Content */
.content { flex: 1; min-width: 0; overflow-y: auto; position: relative; scroll-behavior: smooth; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--side-border); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; transition: background .12s ease, color .12s ease; }
.icon-btn:hover { background: var(--bg-sunk); color: var(--text); }
.icon-btn .ic { width: 18px; height: 18px; }
.topbar .crumb { font-family: var(--sans); font-size: 13px; color: var(--ui); }
.topbar .crumb .sep { color: var(--ui-muted); padding: 0 7px; }
.topbar .spacer { flex: 1; }
.seg { display: inline-flex; background: var(--bg-sunk); border: 1px solid var(--side-border); border-radius: 9px; padding: 2px; }
.seg button { font-family: var(--sans); font-size: 12px; font-weight: 600; border: 0; background: transparent; color: var(--faint); padding: 5px 11px; border-radius: 7px; cursor: pointer; transition: all .12s ease; }
.seg button.on { background: var(--bg); color: var(--accent-ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }

.artifact { max-width: 768px; margin: 0 auto; padding: 20px 44px 96px; }
.artifact .project-crumb { padding: 8px 0 4px; }
.scroll-anchor { scroll-margin-top: 64px; }
.artifact + .artifact { border-top: 1px solid var(--side-border); margin-top: 8px; }
[hidden] { display: none !important; }

.home { max-width: 760px; margin: 0 auto; padding: 40px 44px 96px; }
.home h1 { font-size: 26px; margin: 0 0 6px; }
.home .lede { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 0 0 24px; max-width: 56ch; }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.home-card { text-align: left; font-family: var(--sans); background: var(--bg); border: 1px solid var(--side-border); border-radius: 10px; padding: 16px 16px 18px; cursor: pointer; transition: border-color .14s ease, transform .14s ease, box-shadow .14s ease; }
.home-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.05); }
.home-card .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-ink); margin-bottom: 8px; }
.home-card .ct { font-family: var(--serif); font-size: 17px; color: var(--text); line-height: 1.3; margin-bottom: 6px; }

.user-row { display: flex; justify-content: flex-end; margin: 2px 0 18px; }

.user-bubble p { line-height: 1.55; margin: 0; }

/* ============================================================
   OpenAI Artifact — "On this page" Table of Contents (Docs · OpenAI)
   Desktop right-gutter rail + tablet/mobile dropdown sheet, mirroring
   the platform docs "ON THIS PAGE" nav. Flat, zero-dependency,
   token-driven; injected client-side by src/toc-docs.js

   Breakpoints (deliberately 15% below the usual 768px switch so the

   Colors and geometry come from the design tokens (--toc-*, --text-*,

/* ---- Desktop rail (>= 1088px) — flat, right-aligned, collapsed default ---- */
.toc-rail {
  position: fixed;
  top: calc(var(--hole-top, 40px) + 16px);
  right: calc(var(--hole-x, 8px) + 24px);
  z-index: 60;

  font-size: 10px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase;
}
/* Caret toggle — the desktop TOC toggle icon (see reference/icons/

.toc-toggle { flex: none; }

.toc-fab {

    right: calc(16px + env(safe-area-inset-right));
    max-height: calc(100dvh - 86px);
  }
}

@media print {
  .toc-rail, .toc-fab, .toc-sheet, .toc-scrim { display: none !important; }
}

  var MOBILE_Q = '(max-width: 652.98px)';

  /* Exact glyphs from the locked shell (see reference/icons/). */
  var CARET_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 9 5 5 5-5"></path></svg>';
  var MENU_SVG = '<svg class="icon-menu" viewBox="523 494 18 18" aria-hidden="true"><path d="M523,499C523,498.45 523.45,498 524,498L540,498C540.55,498 541,498.45 541,499C541,499.55 540.55,500 540,500L524,500C523.45,500 523,499.55 523,499Z M523,507C523,506.45 523.45,506 524,506L534,506C534.55,506 535,506.45 535,507C535,507.55 534.55,508 534,508L524,508C523.45,508 523,507.55 523,507Z"></path></svg>';
  var CLOSE_SVG = '<svg class="icon-close" viewBox="477.34 448.34 13.31 13.31" aria-hidden="true"><path d="M477.64,448.64C478.03,448.25 478.66,448.25 479.05,448.64L484,453.59L488.95,448.64C489.34,448.25 489.97,448.25 490.36,448.64C490.75,449.03 490.75,449.66 490.36,450.05L485.41,455L490.36,459.95C490.75,460.34 490.75,460.97 490.36,461.36C489.97,461.75 489.34,461.75 488.95,461.36L484,456.41L479.05,461.36C478.66,461.75 478.03,461.75 477.64,461.36C477.25,460.97 477.25,460.34 477.64,459.95L482.59,455L477.64,450.05C477.25,449.66 477.25,449.03 477.64,448.64Z"></path></svg>';
  var COPY_BTN_HTML = '<div class="copy-wrap"><button type="button" class="copy-button" data-copy-page data-copied="false">'
    + '<svg class="copy-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="10" height="10" rx="2"></rect><path d="M14 6V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h1"></path></svg>'
    + '<svg class="check-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10 4 4 8-9"></path></svg>'
    + '<span>Copy page</span></button></div>';

  var instance = null;

  function slug(text, index) {
    return String(text).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || ('section-' + index);
  }

  function destroy() {
    if (!instance) return;
    instance.cleanups.forEach(function (fn) { try { fn(); } catch (_) {} });
    instance.nodes.forEach(function (n) { if (n && n.parentNode) n.parentNode.removeChild(n); });
    instance = null;
  }

  function mount(opts) {
    destroy();
    opts = opts || {};
    var root = opts.root || document.body;
    var scroll = opts.scroll || window;
    var content = opts.content || document;
    var mobileQuery = window.matchMedia(MOBILE_Q);

    var headings = Array.prototype.slice.call(content.querySelectorAll('h2, h3'));
    if (headings.length < 2) return null;

    /* ---- build DOM ---- */
    var rail = document.createElement('aside');
    rail.className = 'toc-rail cg-noanim';
    rail.id = 'tocRail';
    rail.setAttribute('data-open', 'false');
    rail.setAttribute('data-oaitoc', '1');
    rail.setAttribute('aria-label', 'On this page');
    rail.innerHTML =
      '<div class="toc-head"><span class="toc-label">On this page</span>'
      + '<button type="button" class="icon-button toc-toggle" id="tocToggle" aria-expanded="false" aria-label="Expand table of contents">' + CARET_SVG + '</button></div>'
      + '<div class="toc-collapse"><div class="toc-clip">'
      + '<nav class="toc-nav"><div class="toc-inner">'
      + '<div class="toc-track" aria-hidden="true"></div>'
      + '<div class="toc-indicator" id="tocIndicator" aria-hidden="true"></div>'
      + '<ol class="toc-list" id="tocList"></ol>'
      + '</div></nav>' + COPY_BTN_HTML + '</div></div>';

    var fab = document.createElement('button');
    fab.type = 'button';
    fab.className = 'toc-fab';
    fab.setAttribute('data-toc-button', '');
    fab.setAttribute('data-oaitoc', '1');
    fab.setAttribute('aria-expanded', 'false');
    fab.setAttribute('aria-label', 'Table of contents');
    fab.innerHTML = MENU_SVG + CLOSE_SVG;

    var scrim = document.createElement('div');
    scrim.className = 'toc-scrim';
    scrim.id = 'tocScrim';
    scrim.setAttribute('data-oaitoc', '1');
    scrim.setAttribute('aria-hidden', 'true');

    var sheet = document.createElement('aside');
    sheet.className = 'toc-sheet';
    sheet.id = 'tocSheet';
    sheet.setAttribute('data-oaitoc', '1');
    sheet.setAttribute('aria-label', 'On this page');
    sheet.innerHTML = '<div class="sheet-title">On this page</div><ol class="sheet-list" id="sheetList"></ol>' + COPY_BTN_HTML;

    root.appendChild(rail);
    root.appendChild(fab);
    root.appendChild(scrim);
    root.appendChild(sheet);

    var tocList = rail.querySelector('#tocList');
    var sheetList = sheet.querySelector('#sheetList');
    var tocToggle = rail.querySelector('#tocToggle');
    var tocIndicator = rail.querySelector('#tocIndicator');
    var cleanups = [];
    var tocItems = [];

    function scrollTarget() {
      if (mobileQuery.matches || scroll === window || !scroll) return window;
      return scroll;
    }
    function scrollToHeading(heading) {
      closeSheet();
      var t = scrollTarget();
      var offset = mobileQuery.matches ? 14 : 64;
      if (t === window) {
        window.scrollTo({ top: window.scrollY + heading.getBoundingClientRect().top - offset, behavior: 'smooth' });
      } else {
        t.scrollTo({ top: t.scrollTop + heading.getBoundingClientRect().top - offset, behavior: 'smooth' });
      }
    }

    headings.forEach(function (heading, index) {
      if (!heading.id) heading.id = slug(heading.textContent, index + 1);
      var railLi = document.createElement('li');
      var railLink = document.createElement('a');
      railLink.href = '#' + heading.id;
      railLink.textContent = heading.textContent;
      railLink.addEventListener('click', function (event) { event.preventDefault(); scrollToHeading(heading); });
      railLi.appendChild(railLink);
      tocList.appendChild(railLi);

      var sheetLi = document.createElement('li');
      var sheetLink = railLink.cloneNode(true);
      sheetLink.addEventListener('click', function (event) { event.preventDefault(); scrollToHeading(heading); });
      sheetLi.appendChild(sheetLink);
      sheetList.appendChild(sheetLi);
      tocItems.push({ heading: heading, railLi: railLi, sheetLink: sheetLink });
    });

    /* ---- scroll-spy ---- */
    function currentSection() {
      var active = 0;
      tocItems.forEach(function (item, index) {
        if (item.heading.getBoundingClientRect().top <= 72) active = index;
      });
      return active;
    }
    function updateNavigation() {
      if (!tocItems.length) return;
      var active = currentSection();
      tocItems.forEach(function (item, index) {
        item.railLi.classList.toggle('active', index === active);
        item.sheetLink.classList.toggle('active', index === active);
      });
      var li = tocItems[active].railLi;
      if (tocIndicator && li.offsetParent) {
        tocIndicator.style.height = li.offsetHeight + 'px';
        tocIndicator.style.transform = 'translateY(' + li.offsetTop + 'px)';
      }
    }

    /* ---- sheet ---- */
    function setSheet(open) {
      sheet.classList.toggle('open', open);
      scrim.classList.toggle('open', open);
      fab.setAttribute('aria-expanded', String(open));
    }
    function closeSheet() { setSheet(false); }
    fab.addEventListener('click', function (event) {
      event.stopPropagation();
      setSheet(!sheet.classList.contains('open'));
    });
    scrim.addEventListener('click', closeSheet);
    function onKey(event) { if (event.key === 'Escape') closeSheet(); }
    document.addEventListener('keydown', onKey);
    cleanups.push(function () { document.removeEventListener('keydown', onKey); });

    /* ---- rail collapse + persistence ---- */
    function setRail(open, persist) {
      rail.setAttribute('data-open', String(open));
      tocToggle.setAttribute('aria-expanded', String(open));
      tocToggle.setAttribute('aria-label', open ? 'Collapse table of contents' : 'Expand table of contents');
      if (persist) { try { localStorage.setItem(TOC_STORE_KEY, open ? '1' : '0'); } catch (_) {} }
    }
    tocToggle.addEventListener('click', function () {
      setRail(rail.getAttribute('data-open') === 'false', true);
    });
    var railPref = false;
    try { railPref = localStorage.getItem(TOC_STORE_KEY) === '1'; } catch (_) {}
    setRail(railPref, false);
    requestAnimationFrame(function () { requestAnimationFrame(function () { rail.classList.remove('cg-noanim'); }); });

    /* ---- copy page ---- */
    function fallbackCopy(text) {
      var area = document.createElement('textarea');
      area.value = text; area.setAttribute('readonly', '');
      area.style.position = 'fixed'; area.style.opacity = '0';
      document.body.appendChild(area); area.select();
      try { document.execCommand('copy'); } catch (_) {}
      area.remove();
    }
    var copyButtons = Array.prototype.slice.call(rail.querySelectorAll('[data-copy-page]'))
      .concat(Array.prototype.slice.call(sheet.querySelectorAll('[data-copy-page]')));
    copyButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        var srcEl = content === document ? document.body : content;
        var text = srcEl.innerText.trim();
        var job = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.resolve(fallbackCopy(text));
        job.catch(function () { fallbackCopy(text); }).then(function () {
          copyButtons.forEach(function (b) { b.setAttribute('data-copied', 'true'); b.querySelector('span').textContent = 'Copied'; });
          window.setTimeout(function () {
            copyButtons.forEach(function (b) { b.setAttribute('data-copied', 'false'); b.querySelector('span').textContent = 'Copy page'; });
          }, 1600);
        });
      });
    });

    /* ---- listeners ---- */
    function onAnyScroll() { updateNavigation(); }
    window.addEventListener('scroll', onAnyScroll, { passive: true });
    cleanups.push(function () { window.removeEventListener('scroll', onAnyScroll); });
    if (scroll && scroll !== window && scroll.addEventListener) {
      scroll.addEventListener('scroll', onAnyScroll, { passive: true });
      cleanups.push(function () { scroll.removeEventListener('scroll', onAnyScroll); });
    }
    function onResize() { updateNavigation(); closeSheet(); }
    window.addEventListener('resize', onResize, { passive: true });
    cleanups.push(function () { window.removeEventListener('resize', onResize); });
    if (mobileQuery.addEventListener) {
      var onBp = function () { updateNavigation(); closeSheet(); };
      mobileQuery.addEventListener('change', onBp);
      cleanups.push(function () { mobileQuery.removeEventListener('change', onBp); });
    }

    requestAnimationFrame(updateNavigation);

    instance = { nodes: [rail, fab, scrim, sheet], cleanups: cleanups, update: updateNavigation };
    return instance;
  }

  return { mount: mount, destroy: destroy };
})();

</script><script>
(function(){
  var ARTS = window.__ARTIFACTS__ || [];
  var NAV_DEFAULT = window.__NAV__ || "showhide";
  var root = document.documentElement;
  var app = document.getElementById('app');
  var listEl = document.getElementById('side-list');
  var contentEl = document.getElementById('content');
  var crumbEl = document.getElementById('crumb');
  var searchEl = document.getElementById('search');
  var nav = NAV_DEFAULT, current = "home", query = "";

  function ic(name){ return '<svg class="ic"><use href="#ic-'+name+'"/></svg>'; }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function renderSidebar(){
    var html = '';
    html += '<div class="side-item'+(current==='home'?' active':'')+'" data-id="home">'+ic('home')+'<span class="label">Home</span></div>';
    html += '<div class="side-divider"></div>';
    html += '<div class="side-section">Briefings</div>';
    var shown = ARTS.filter(function(a){ return a.title.toLowerCase().indexOf(query.toLowerCase())>=0; });
    if(!shown.length){ html += '<div style="padding:8px 12px;font-size:12px;color:var(--side-faint)">No matches</div>'; }
    shown.forEach(function(a){
      html += '<div class="side-item'+(current===a.id?' active':'')+'" data-id="'+a.id+'" title="'+esc(a.title)+'">'+ic('doc')+'<span class="label">'+esc(a.title)+'</span></div>';
    });
    listEl.innerHTML = html;
    listEl.querySelectorAll('.side-item').forEach(function(el){
      el.addEventListener('click', function(){ select(el.getAttribute('data-id')); });
    });
  }

  function artHTML(a){
    return '<article class="artifact email-pane font-openai-response scroll-anchor" id="art-'+a.id+'" data-screen-label="'+esc(a.title)+'">'+
      '<div class="project-crumb">'+esc(a.project)+'<span class="sep">/</span>'+esc(a.crumb)+'<span class="chev">\u2304</span></div>'+
      '<div class="email-note">Original email HTML, unmodified.</div>'+a.html+'</article>';
  }
  function homeHTML(){
    var cards = ARTS.map(function(a){
      return '<button class="home-card" data-id="'+a.id+'"><div class="kind">'+esc(a.kind)+'</div><div class="ct">'+esc(a.title)+'</div><div class="cd">'+esc(a.project)+'</div></button>';
    }).join('');
    return '<div class="home" data-screen-label="Home"><h1>'+esc(window.__INDEX_TITLE__||'Briefings')+'</h1>'+
      '<p class="lede">Every property briefing sent to Mom, rendered exactly as it arrived in her inbox. Pick an issue from the sidebar, or start from a card below.</p>'+
      '<div class="home-grid">'+cards+'</div></div>';
  }

  function renderContent(){
    if(nav === 'scrollto'){
      var html = (current==='home') ? homeHTML() : '';
      html += ARTS.map(artHTML).join('');
      contentEl.innerHTML = html;
    } else {
      contentEl.innerHTML = (current==='home') ? homeHTML() : ARTS.filter(function(a){return a.id===current;}).map(artHTML).join('');
    }
    contentEl.querySelectorAll('.home-card').forEach(function(el){
      el.addEventListener('click', function(){ select(el.getAttribute('data-id')); });
    });
    refreshTOC();
  }

  function setCrumb(){
    var name = (window.__INDEX_TITLE__||'Briefings');
    if(current!=='home'){ var a = ARTS.filter(function(x){return x.id===current;})[0]; if(a) name = a.crumb; }
    crumbEl.innerHTML = esc(window.__INDEX_PROJECT__||'ChatGPT Project')+'<span class="sep">/</span>'+esc(name);
  }


  function refreshTOC(){
    if(!window.OpenAIDocsTOC) return;
    window.OpenAIDocsTOC.destroy();
    window.OpenAIDocsTOC.mount({ root: document.body, scroll: contentEl, content: contentEl });
  }


  function select(id){
    current = id;
    if(nav === 'scrollto'){
      renderSidebar(); setCrumb();
      if(id==='home'){ contentEl.scrollTo({top:0,behavior:'smooth'}); }
      else { var el = document.getElementById('art-'+id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
    } else {
      renderContent(); renderSidebar(); setCrumb(); contentEl.scrollTop = 0;
    }
  }

  function switchNav(mode){ nav = mode; current = 'home';
    document.querySelectorAll('.seg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-nav')===mode); });
    renderContent(); renderSidebar(); setCrumb(); contentEl.scrollTop = 0;
  }

  // theme toggle
  var ttBtn = document.getElementById('theme-toggle');
  function renderTT(){ var dark = root.getAttribute('data-theme')==='dark';
    ttBtn.setAttribute('aria-pressed', dark?'true':'false');
    ttBtn.setAttribute('aria-label', dark?'Switch to light mode':'Switch to dark mode'); }
  ttBtn.addEventListener('click', function(){ root.setAttribute('data-theme', root.getAttribute('data-theme')==='dark'?'light':'dark'); renderTT(); });

  // sidebar collapse + search + nav segmented control
  document.getElementById('collapse').addEventListener('click', function(){ app.classList.toggle('collapsed'); });
  searchEl.addEventListener('input', function(){ query = searchEl.value; renderSidebar(); });
  function syncScrollCrumb(){
    if(nav !== 'scrollto') return;
    if(contentEl.scrollTop < 48){
      if(current !== 'home'){ current = 'home'; renderSidebar(); setCrumb(); }
      return;
    }
    var nearest = null, best = Infinity;
    contentEl.querySelectorAll('article.artifact').forEach(function(el){
      var distance = Math.abs(el.offsetTop - contentEl.scrollTop);
      if(distance < best){ best = distance; nearest = el; }
    });
    if(nearest){
      var id = nearest.id.replace(/^art-/, '');
      if(id && current !== id){ current = id; renderSidebar(); setCrumb(); }
    }
  }
  contentEl.addEventListener('scroll', syncScrollCrumb, {passive:true});
  document.querySelectorAll('.seg button').forEach(function(b){ b.addEventListener('click', function(){ switchNav(b.getAttribute('data-nav')); }); });

  // init
  document.querySelectorAll('.seg button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-nav')===nav); });
  renderSidebar(); renderContent(); setCrumb(); renderTT();
})();

(function(){
  var app = document.getElementById('app');
  var mq  = window.matchMedia('(max-width: 720px)');
  var scrim = document.createElement('div');
  scrim.className = 'scrim';
  document.body.appendChild(scrim);
  scrim.addEventListener('click', function(){ app.classList.add('collapsed'); });
  function syncScrim(){ scrim.classList.toggle('on', mq.matches && !app.classList.contains('collapsed')); }
  function applyBreakpoint(){ if (mq.matches) app.classList.add('collapsed'); syncScrim(); }
  applyBreakpoint();
  if (mq.addEventListener) mq.addEventListener('change', applyBreakpoint);
  new MutationObserver(syncScrim).observe(app, {attributes:true, attributeFilter:['class']});
  document.getElementById('side-list').addEventListener('click', function(e){
    if (mq.matches && e.target.closest('.side-item')) app.classList.add('collapsed');
  }, true);
  // keep the nav-mode attribute in sync so the iframe height rule can react
  function syncMode(){
    var on = document.querySelector('.seg button.on');
    app.setAttribute('data-mode', on ? on.getAttribute('data-nav') : 'showhide');
  }
  syncMode();
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){ setTimeout(syncMode, 0); });
  });
})();

(function(){
  // Stacked (scroll-to) mode: grow each frame to its content when the browser
  // allows same-origin access to the srcdoc document; otherwise the CSS
  // fallback height stands.
  function fit(fr){
    try {
      var d = fr.contentDocument;
      if (!d || !d.body) return;
      var h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
      if (h > 200) fr.style.height = (h + 24) + 'px';
    } catch (e) { /* opaque origin — keep the CSS height */ }
  }
  function scan(){
    if (document.getElementById('app').getAttribute('data-mode') !== 'scrollto') return;
    document.querySelectorAll('.email-frame').forEach(function(fr){
      if (fr.dataset.fitted) return;
      fr.dataset.fitted = '1';
      if (fr.contentDocument && fr.contentDocument.readyState === 'complete') fit(fr);
      else fr.addEventListener('load', function(){ fit(fr); });
    });
  }
  new MutationObserver(scan).observe(document.getElementById('content'), {childList:true, subtree:true});
  scan();
})();
</script></body></html>
